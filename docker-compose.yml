services:
  jirastack:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - JIRA_USER_EMAIL=${JIRA_USER_EMAIL}
      - JIRA_BASE_URL=${JIRA_BASE_URL}
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - PORT=3000
    restart: unless-stopped
